name: Docker publish

# Builds prebuilt backend/frontend images and pushes them to GHCR on every
# merge to main, tagged :latest and :<short-sha>. A deploy server then only
# ever needs `docker compose pull && docker compose up -d` — no repo
# checkout, no npm/tsc toolchain — see docs/DEPLOYMENT.md.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # linux/arm64 via QEMU emulation, alongside the runner's native
      # linux/amd64 — a GHCR image built amd64-only silently fails to
      # `docker compose pull` on any Apple Silicon Mac ("no matching
      # manifest for linux/arm64/v8"), confirmed live the first time this
      # was pulled locally. Slower (apt-get et al run emulated for the
      # arm64 pass) but this is the whole point of a "pullable directly"
      # image — it has to actually pull on whatever's doing the pulling.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No SSM secrets needed at build time here — the backend reads every
      # secret from env at container start (docker-entrypoint.sh), never
      # bakes anything in. Only the frontend build below needs SSM access,
      # for NEXT_PUBLIC_* vars that `next build` inlines at build time.
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/alioskillers/united-services-backend:latest
            ghcr.io/alioskillers/united-services-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # NEXT_PUBLIC_* vars get inlined into the compiled JS at `next
      # build` time, so this build stage needs its own AWS SSM access to
      # fetch them — see frontend/Dockerfile's build stage comment. Passed
      # as BuildKit secrets (never ARG/ENV — those persist in image layer
      # history), so they only ever exist inside the one RUN step that
      # reads them, never in the pushed image itself.
      - name: Write build secrets to files
        run: |
          printf '%s' "${{ secrets.AWS_ACCESS_KEY_ID }}" > /tmp/aws_access_key_id
          printf '%s' "${{ secrets.AWS_SECRET_ACCESS_KEY }}" > /tmp/aws_secret_access_key
          printf '%s' "${{ secrets.AWS_REGION }}" > /tmp/aws_region
          printf '%s' "${{ secrets.APP_ENV }}" > /tmp/app_env
      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          secret-files: |
            aws_access_key_id=/tmp/aws_access_key_id
            aws_secret_access_key=/tmp/aws_secret_access_key
            aws_region=/tmp/aws_region
            app_env=/tmp/app_env
          tags: |
            ghcr.io/alioskillers/united-services-frontend:latest
            ghcr.io/alioskillers/united-services-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# NOTE on registry-side growth: every push here tags a new :<sha> image and
# never deletes old ones, so GHCR storage for these two packages grows
# unbounded over time — the local-disk pileup this file's local-cleanup
# comments address is a separate problem, already handled (see
# scripts/deploy.sh and README.md's "Running with Docker" section).
# Deliberately NOT auto-pruning old GHCR versions here: actions/delete-
# package-versions (the standard tool for this) documents no guarantee
# about multi-arch manifest lists, and each push here creates several
# untagged per-platform images that a real :latest/: <sha> manifest list
# still references — a naive "keep the N most recent versions" cutoff
# could delete one of those out from under a manifest a server is still
# pulling, breaking `docker pull` for one architecture only, silently,
# discovered only at the next deploy. If/when this needs addressing,
# verify the deletion logic against these packages' actual multi-arch
# structure first (`gh api /user/packages/container/<name>/versions`) —
# don't add an automated prune step without that verification.
