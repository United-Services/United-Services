# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow integrates njsscan with GitHub's Code Scanning feature
# nodejsscan is a static security code scanner that finds insecure code patterns in your Node.js applications

name: njsscan sarif

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '24 8 * * 3'

permissions:
  contents: read

jobs:
  njsscan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    name: njsscan code scanning
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    # continue-on-error at the STEP level, not `|| true` inside `args`.
    # The shell-level `|| true` that used to live in the args string
    # meant the scan could never fail this step regardless of findings —
    # which also made any continue-on-error setting on the step
    # meaningless. Step-level lets the SARIF upload below still run on a
    # scan failure while leaving the step's own conclusion honest.
    # (This workflow is advisory either way — see SECURITY.md; the
    # blocking gates are the jobs inside ci.yml.)
    - name: nodejsscan scan
      id: njsscan
      continue-on-error: true
      uses: ajinabraham/njsscan-action@7237412fdd36af517e2745077cedbf9d6900d711
      with:
        args: '. --sarif --output results.sarif'
    - name: Upload njsscan report
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
