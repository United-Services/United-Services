name: Auto-merge

# Enables GitHub's native auto-merge on a PR as soon as it's opened/updated.
# GitHub then merges it automatically once all required status checks
# (the 3 CI jobs, per branch protection) pass — no manual click needed.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
