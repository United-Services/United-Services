# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up Snyk to analyze the full Snyk platform (Snyk Open Source, Snyk Code,
# Snyk Container and Snyk Infrastructure as Code)
# The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
# The results of Snyk Code are then uploaded to GitHub Security Code Scanning
#
# In order to use the Snyk Action you will need to have a Snyk API token.
# More details in https://github.com/snyk/actions#getting-your-snyk-token
# or you can signup for free at https://snyk.io/login
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["main" ]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    # Job-level, not on a single step — confirmed live this was the real
    # cause of a persistent 401 across every real `snyk` command
    # regardless of the token's own value: a step-level `env:` (as this
    # was originally, only on "Set up Snyk CLI") only applies to that
    # one step's process, never to sibling steps. Every step below that
    # actually authenticates (code test, monitor, container monitor)
    # needs this too, so it belongs at the job level where all of them
    # inherit it.
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Snyk CLI to check for security issues
        # Snyk can be used to break the build when it detects security issues.
        # In this case we want to upload the SAST issues to GitHub Code Scanning
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

        # For Snyk Open Source you must first set up the development environment for your application's dependencies
        # For example for Node
        #- uses: actions/setup-node@v4
        #  with:
        #    node-version: 20

        # Runs Snyk Code (SAST) analysis and uploads result into GitHub.
        # `|| true`: findings should surface via the SARIF upload to
        # GitHub Code Scanning below, not fail this job outright — the
        # trailing `# || true` this line originally had was a dead shell
        # comment (everything after `#` is inert), which is why this
        # step still failed the whole workflow on real findings even
        # though that clearly wasn't the intent.
      - name: Snyk Code test
        run: snyk code test --sarif > snyk-code.sarif || true

        # Runs Snyk Open Source (SCA) analysis and uploads result to Snyk.
      - name: Snyk Open Source monitor
        run: snyk monitor --all-projects

        # Runs Snyk Infrastructure as Code (IaC) analysis and uploads result to Snyk.
        # Same dead-comment issue as above — `|| true` now actually applies.
      - name: Snyk IaC test and report
        run: snyk iac test --report || true

        # Build the docker image for testing. This repo builds several
        # separate images (backend/frontend/support-agent), not one —
        # scanning the main backend image here specifically, since it's
        # the one actually handling user data; the placeholder template
        # value ("your/image-to-test", repo root, no such Dockerfile)
        # would have failed this step outright on any real run.
      - name: Build a Docker image
        run: docker build -t united-services-backend:scan-test ./backend
        # Runs Snyk Container (Container and SCA) analysis and uploads result to Snyk.
      - name: Snyk Container monitor
        run: snyk container monitor united-services-backend:scan-test --file=backend/Dockerfile

        # Push the Snyk Code results into GitHub Code Scanning tab
      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
