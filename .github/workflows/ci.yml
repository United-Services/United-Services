name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for every job below — none of them push
# commits, comment on PRs, or touch releases; they only read the repo
# to test/build/scan it. Without this, each job's GITHUB_TOKEN falls
# back to whatever the org/repo's default token permissions are, which
# is exactly the kind of implicit, could-silently-change scope CodeQL's
# "Workflow does not contain permissions" flags. secret-scan already
# had its own `permissions: contents: read` before this existed at the
# root — redundant now but harmless to leave, since an explicit
# per-job block always wins over this default regardless.
permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `semgrep ci` (not `semgrep scan`) — the CI-aware subcommand: pulls
      # this repo's rule config from the Semgrep dashboard (tied to the
      # GitHub App install), posts results back there and as PR comments,
      # and exits non-zero on a finding that should block the PR. Runs as
      # a job in this same "CI" workflow (not left as a separate App-only
      # check off to the side) specifically so it's covered by
      # auto-merge.yml's workflow_run gate — branch protection isn't
      # available on this org's Free plan (see that workflow's own
      # comment), so a finding here has to fail the whole "CI" workflow's
      # conclusion to actually block a merge, not just show up as an
      # informational comment nothing enforces.
      - run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Free substitute for GitHub's own secret scanning/push protection —
      # those require GitHub Advanced Security, which isn't purchasable on
      # this repo's plan. Confirmed live moving to the United-Services org:
      # the gitleaks/gitleaks-action wrapper itself requires a paid license
      # for organization-owned repos ("[United-Services] is an
      # organization. License key is required.") — free only for personal
      # accounts. The underlying gitleaks scanner is still fully open
      # source regardless of who owns the repo; installing and running the
      # real binary directly sidesteps the wrapper action's license gate
      # entirely, not a workaround of gitleaks' own actual licensing.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      # Same scan scope the old action used: this PR's own new commits
      # (--first-parent <base>..<head>) rather than the whole repo history
      # every single run — a PR's commits are what a fresh run actually
      # needs to catch; a push straight to main (no PR base to diff
      # against) scans just the one new commit instead.
      - name: Run gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --redact -v --exit-code=1 \
              --log-opts="--no-merges --first-parent ${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            gitleaks detect --redact -v --exit-code=1 --log-opts="-1"
          fi

  backend:
    name: Backend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Prisma client generation needs a schema-valid DATABASE_URL string,
      # but not a reachable database — validate/generate don't connect.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/ci
          DIRECT_URL: postgresql://user:password@localhost:5432/ci
      - run: npx tsc --noEmit -p tsconfig.json
      # Unit tests use a FakeKekKeyStore (real in-memory libsodium
      # keypairs, no disk/DB) — see crypto/testing/fake-kek-key-store.ts —
      # so no KEK_KEYS_DIR or seeded KekRegistry row is needed here.
      - name: Unit tests
        run: npm test -- --ci
      - run: npm run build
      # npm's audit-quick endpoint intermittently 500s (it's being
      # retired in favor of a bulk advisory endpoint per npm's own
      # notice) — retry a few times before treating it as a real
      # failure, since a registry blip isn't a finding.
      - name: npm audit
        run: |
          for i in 1 2 3; do
            npm audit --audit-level=high && exit 0
            echo "npm audit attempt $i failed, retrying..."
            sleep 10
          done
          exit 1

  backend-integration:
    name: Backend — integration tests (real Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: use_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/use_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/use_ci
      REDIS_URL: redis://localhost:6379
      # FailoverService/PrismaModule/RedisModule each open a second
      # connection for the local-standby role (see backend/src/failover/)
      # — CI only has the one postgres/redis service above, so point the
      # "local" role at the exact same one rather than a nonexistent
      # second instance. Functionally identical to how docker-compose.yml
      # points it at the real standby containers in every other
      # environment.
      LOCAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/use_ci
      LOCAL_REDIS_URL: redis://localhost:6379
      TOTP_KEK_PROVIDER: local
      KEK_KEYS_DIR: ./secrets/kek
      CLERK_SECRET_KEY: sk_test_ci-placeholder-key
      AWS_REGION: us-east-1
      # Dummy static credentials — without them the AWS SDK's credential
      # provider chain falls through to an IMDS lookup that hangs for a
      # long time on a non-EC2 runner and can make the whole job time out.
      AWS_ACCESS_KEY_ID: ci-placeholder
      AWS_SECRET_ACCESS_KEY: ci-placeholder
      S3_BUCKET_NAME: ci-placeholder-bucket
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_ORIGIN: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # AppModule bootstrap requires an active KekRegistry row + its
      # private key file on disk (KekKeyStore.onModuleInit) — generate one
      # fresh for this ephemeral CI database, same as a real first deploy.
      - run: npm run kek:generate
      # Nest's Redis/Postgres client handles stay open at test-process
      # exit by design (they're app-lifetime singletons) — --forceExit is
      # expected here, not masking a real leak the unit-test job would fail.
      - name: Integration tests (e2e)
        run: npx jest --config ./test/jest-e2e.json --forceExit

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY must be a syntactically valid test
      # key for the build to succeed even though no real Clerk instance is
      # reachable in CI.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIta2V5LmNsZXJrLmFjY291bnRzLmRldiQ
          CLERK_SECRET_KEY: sk_test_ci-placeholder-key
          NEXT_PUBLIC_API_URL: http://localhost:3002/api/v1
      # See backend job's npm audit step for why this retries.
      - name: npm audit
        run: |
          for i in 1 2 3; do
            npm audit --audit-level=high && exit 0
            echo "npm audit attempt $i failed, retrying..."
            sleep 10
          done
          exit 1

  support-agent:
    name: Support-agent — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: support-agent/backend
    # Real Postgres, not the sqlite/mock kind — the whole point of
    # tests/test_transcript_store.py is proving the atomic JSONB append
    # actually behaves as one row per user against a real database. This
    # is the CI job that didn't exist when a broken langchain 1.3.9 +
    # langgraph 0.2.62 combination (they don't even resolve together)
    # got auto-merged to main by Dependabot's own auto-merge, undetected,
    # because nothing here ever imported support-agent's code at all.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: support_agent
          POSTGRES_PASSWORD: support_agent
          POSTGRES_DB: support_agent
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U support_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Placeholders — no test here calls a real OpenRouter/Clerk
      # endpoint (tests/test_clerk_auth.py signs its own tokens against a
      # locally-generated keypair instead of the real Clerk JWKS; nothing
      # invokes app.agent.llm.build_llm against real OpenRouter). Only
      # exist so Settings() can construct at all — these fields have no
      # default in app/config.py.
      OPENROUTER_API_KEY: ci-placeholder
      CLERK_SECRET_KEY: sk_test_ci-placeholder-key
      DATABASE_URL: postgresql://support_agent:support_agent@localhost:5433/support_agent
      LOCAL_DATABASE_URL: postgresql+psycopg://support_agent:support_agent@localhost:5433/support_agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # backend/Dockerfile's own base image (python:3.12-slim) — matches
      # what actually runs in production, not whatever's newest.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: support-agent/backend/requirements-dev.txt
      # CLERK_PUBLISHABLE_KEY computed here, not committed as a static
      # value — app/security/clerk_auth.py derives its expected `iss`
      # claim from this at import time (a Clerk publishable key is
      # "pk_test_" + base64(frontend-api-domain + "$")), so it has to
      # decode to something domain-shaped even though no test here hits
      # the real Clerk JWKS. A fixed high-entropy blob sitting in source
      # is exactly the pattern gitleaks' generic-api-key rule exists to
      # catch, correctly, even when the value itself is fake — the
      # previous version of this line (a static
      # pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk literal) tripped it for
      # real, and the fix is to not have a static secret-shaped literal
      # in the repo at all, not to suppress the finding.
      - name: Compute placeholder CLERK_PUBLISHABLE_KEY
        run: echo "CLERK_PUBLISHABLE_KEY=pk_test_$(echo -n 'ci-test.clerk.accounts.dev$' | base64 -w0)" >> "$GITHUB_ENV"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v
