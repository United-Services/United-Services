name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action calls the PR-commits API to diff exactly this PR's
    # commits and (on a finding) comments on the PR — both need scopes the
    # default GITHUB_TOKEN doesn't carry unless granted here explicitly.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Free substitute for GitHub's own secret scanning/push protection —
      # those require GitHub Advanced Security, which isn't purchasable on
      # this repo's (personal-account) plan. gitleaks scans the full commit
      # history on every push/PR and fails the build on a match, so this
      # runs in addition to (not instead of) never committing real secrets
      # in the first place.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Prisma client generation needs a schema-valid DATABASE_URL string,
      # but not a reachable database — validate/generate don't connect.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/ci
          DIRECT_URL: postgresql://user:password@localhost:5432/ci
      - run: npx tsc --noEmit -p tsconfig.json
      # Unit tests use a FakeKekKeyStore (real in-memory libsodium
      # keypairs, no disk/DB) — see crypto/testing/fake-kek-key-store.ts —
      # so no KEK_KEYS_DIR or seeded KekRegistry row is needed here.
      - name: Unit tests
        run: npm test -- --ci
      - run: npm run build
      - run: npm audit --audit-level=high

  backend-integration:
    name: Backend — integration tests (real Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: use_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/use_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/use_ci
      REDIS_URL: redis://localhost:6379
      # FailoverService/PrismaModule/RedisModule each open a second
      # connection for the local-standby role (see backend/src/failover/)
      # — CI only has the one postgres/redis service above, so point the
      # "local" role at the exact same one rather than a nonexistent
      # second instance. Functionally identical to how docker-compose.yml
      # points it at the real standby containers in every other
      # environment.
      LOCAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/use_ci
      LOCAL_REDIS_URL: redis://localhost:6379
      TOTP_KEK_PROVIDER: local
      KEK_KEYS_DIR: ./secrets/kek
      CLERK_SECRET_KEY: sk_test_ci-placeholder-key
      AWS_REGION: us-east-1
      # Dummy static credentials — without them the AWS SDK's credential
      # provider chain falls through to an IMDS lookup that hangs for a
      # long time on a non-EC2 runner and can make the whole job time out.
      AWS_ACCESS_KEY_ID: ci-placeholder
      AWS_SECRET_ACCESS_KEY: ci-placeholder
      S3_BUCKET_NAME: ci-placeholder-bucket
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_ORIGIN: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # AppModule bootstrap requires an active KekRegistry row + its
      # private key file on disk (KekKeyStore.onModuleInit) — generate one
      # fresh for this ephemeral CI database, same as a real first deploy.
      - run: npm run kek:generate
      # Nest's Redis/Postgres client handles stay open at test-process
      # exit by design (they're app-lifetime singletons) — --forceExit is
      # expected here, not masking a real leak the unit-test job would fail.
      - name: Integration tests (e2e)
        run: npx jest --config ./test/jest-e2e.json --forceExit

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY must be a syntactically valid test
      # key for the build to succeed even though no real Clerk instance is
      # reachable in CI.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIta2V5LmNsZXJrLmFjY291bnRzLmRldiQ
          CLERK_SECRET_KEY: sk_test_ci-placeholder-key
          NEXT_PUBLIC_API_URL: http://localhost:3002/api/v1
      - run: npm audit --audit-level=high

  support-agent:
    name: Support-agent — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: support-agent/backend
    # Real Postgres, not the sqlite/mock kind — the whole point of
    # tests/test_transcript_store.py is proving the atomic JSONB append
    # actually behaves as one row per user against a real database. This
    # is the CI job that didn't exist when a broken langchain 1.3.9 +
    # langgraph 0.2.62 combination (they don't even resolve together)
    # got auto-merged to main by Dependabot's own auto-merge, undetected,
    # because nothing here ever imported support-agent's code at all.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: support_agent
          POSTGRES_PASSWORD: support_agent
          POSTGRES_DB: support_agent
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U support_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Placeholders — no test here calls a real OpenRouter/Clerk
      # endpoint (tests/test_clerk_auth.py signs its own tokens against a
      # locally-generated keypair instead of the real Clerk JWKS; nothing
      # invokes app.agent.llm.build_llm against real OpenRouter). Only
      # exist so Settings() can construct at all — these fields have no
      # default in app/config.py.
      OPENROUTER_API_KEY: ci-placeholder
      CLERK_SECRET_KEY: sk_test_ci-placeholder-key
      # Validly-shaped, not a real Clerk key — app/security/clerk_auth.py
      # derives its expected `iss` claim from this at import time
      # (base64("test.clerk.accounts.dev$")), so it has to decode
      # cleanly even though no test hits the real Clerk JWKS.
      CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk
      DATABASE_URL: postgresql://support_agent:support_agent@localhost:5433/support_agent
      LOCAL_DATABASE_URL: postgresql+psycopg://support_agent:support_agent@localhost:5433/support_agent
    steps:
      - uses: actions/checkout@v7
      # backend/Dockerfile's own base image (python:3.12-slim) — matches
      # what actually runs in production, not whatever's newest.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: support-agent/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v
