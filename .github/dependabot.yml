version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    # Waits this many days after a version is published before Dependabot
    # proposes it — a newly-published package can be malicious (a
    # compromised maintainer account, a typosquat) or just genuinely
    # unstable; most real-world incidents get caught/yanked within days,
    # so this buys time for that to happen before it ever reaches a PR
    # here.
    cooldown:
      default-days: 7
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
