# Local/self-hosted deployment stack — see docs/DEPLOYMENT.md "Option A".
# `docker compose up` gives you a fully working stack with local Postgres
# + Redis containers out of the box. To use managed services instead
# (Supabase/Upstash, as this project runs in dev — see
# docs/CREDENTIALS_CHECKLIST.md), just override DATABASE_URL/DIRECT_URL/
# REDIS_URL in .env and drop the `postgres`/`redis` services (or leave
# them running unused — backend/frontend only ever talk to whatever URL
# is in the env vars, not directly to these container names).
#
# Required .env at the repo root — see docs/CREDENTIALS_CHECKLIST.md's
# "`.env.example` shape" section for the full list. This file
# intentionally does NOT hardcode any secret values.

services:
  # Both local containers are opt-in via the "local-db" profile
  # (`docker compose --profile local-db up`) — when DATABASE_URL/
  # DIRECT_URL/REDIS_URL point at managed services (Supabase/Upstash, as
  # in .env.prod), these never start and backend never waits on them.
  postgres:
    image: postgres:16
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-united_services}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7
    restart: unless-stopped
    profiles: ["local-db"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Self-hosted machine translation for OpenPosition content (Careers page)
  # — see TranslationsModule. Genuinely free: no billing account, no API
  # key, unlike Google Cloud Translation. Not published to the host by
  # default (only `backend`, over the internal Docker network, needs it —
  # matches how `postgres`/`redis` above have no ports: mapping either).
  # `127.0.0.1:5001:5000` below is the one deliberate exception: this
  # project's own local dev runs `backend` directly on the host rather
  # than inside this compose stack, so that loopback-only mapping is what
  # lets host-run local dev reach it at all — still never reachable from
  # outside the machine either way. Host side is 5001, not the container's
  # native 5000: macOS's built-in AirPlay Receiver (Control Center) also
  # listens on 5000 and answers any request there with a bare 403 before
  # it ever reaches this container — LIBRETRANSLATE_URL in backend/.env
  # must point at 5001 to actually reach LibreTranslate.
  libretranslate:
    image: libretranslate/libretranslate:latest
    command: ["--load-only", "en,ar,zh"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      # Persists downloaded Argos Translate language models across
      # restarts — first startup is slower than subsequent ones while
      # these download.
      - libretranslate-models:/home/libretranslate/.local
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [libretranslate]
    environment:
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-united_services}}
      DIRECT_URL: ${DIRECT_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-united_services}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN}
      # Phone-paging on-call alerting for 5xx errors — see
      # backend/src/alerting/ and docs/DEPLOYMENT.md's "On-call alerting"
      # section. Defaults to disabled: ALERTING_ENABLED must be explicitly
      # set to "true" in .env (the real production one, never local dev)
      # for this to do anything at all.
      ALERTING_ENABLED: ${ALERTING_ENABLED:-false}
      NTFY_TOPIC_URL: ${NTFY_TOPIC_URL}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_ORIGIN: ${WEBAUTHN_RP_ORIGIN:-http://localhost}
      TOTP_KEK_PROVIDER: local
      KEK_KEYS_DIR: /app/secrets/kek
      # Internal Docker service name — resolves for `backend` (a
      # container on the same network) even though the host-mapped
      # 127.0.0.1:5000 above is what backend/.env uses for host-run dev.
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:5000}
      TRANSLATION_MONTHLY_CHAR_BUDGET: ${TRANSLATION_MONTHLY_CHAR_BUDGET:-2000000}
      TRANSLATION_LOCK_TTL_MS: ${TRANSLATION_LOCK_TTL_MS:-30000}
      TRANSLATION_SYNC_WAIT_MS: ${TRANSLATION_SYNC_WAIT_MS:-2500}
    volumes:
      # TOTP KEK private keys must survive container restarts/redeploys —
      # never let this be an ephemeral container filesystem path.
      - kek-keys:/app/secrets/kek
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?set CLERK_PUBLISHABLE_KEY in .env}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    restart: unless-stopped
    depends_on: [backend]
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  redis-data:
  kek-keys:
  libretranslate-models:
