# Local/self-hosted deployment stack — see docs/DEPLOYMENT.md "Option A".
#
# Secrets model: the host's .env at the repo root supplies ONLY
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION / APP_ENV — those
# four are passed straight through to backend/frontend below with no
# defaults. Every other secret/config value (DATABASE_URL, CLERK keys,
# S3 bucket, Betterstack tokens, WebAuthn RP config, translation budget,
# GeoIP account, etc.) is fetched at container start from AWS SSM
# Parameter Store under /united-services/${APP_ENV}/ — see
# backend/scripts/fetch-secrets.sh and frontend/scripts/fetch-secrets.sh.
# Nothing environment-specific is hardcoded in this file or either
# Dockerfile; see docs/CREDENTIALS_CHECKLIST.md for how to populate SSM.
#
# `postgres`/`redis` below are local-dev-only opt-in containers (the
# "local-db" profile) for running entirely without any managed service —
# backend never talks to these container names directly, only to whatever
# DATABASE_URL/REDIS_URL comes back from SSM, so leaving these stopped is
# always safe.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7
    restart: unless-stopped
    profiles: ["local-db"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Self-hosted machine translation for OpenPosition/Service content — see
  # TranslationsModule. Genuinely free: no billing account, no API key.
  # Not published to the host by default — only `backend`, over the
  # internal Docker network, needs it. `127.0.0.1:5001:5000` is the one
  # deliberate exception: local dev runs `backend` directly on the host
  # rather than inside this compose stack, so that loopback-only mapping
  # is what lets host-run local dev reach it at all. Host side is 5001,
  # not the container's native 5000: macOS's built-in AirPlay Receiver
  # also listens on 5000 and answers with a bare 403 first — the
  # LIBRETRANSLATE_URL secret in SSM must point at 5001.
  libretranslate:
    image: libretranslate/libretranslate:latest
    command: ["--load-only", "en,ar,zh"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    networks: [internal]

  backend:
    # `image:` + `build:` together: a plain `docker compose pull && up -d`
    # (no `--build`) uses the prebuilt image from GHCR and never touches
    # `build:` at all — the server doesn't need backend/ checked out, or
    # npm/tsc/@nestjs-cli installed, just this file + .env + nginx.conf.
    # `build:` stays for local dev (`docker compose up -d --build`) and
    # for docker-publish.yml, which builds+pushes this exact tag on every
    # merge to main. See docs/DEPLOYMENT.md's "Deploying an update" section.
    image: ghcr.io/alioskillers/united-services-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [libretranslate]
    environment:
      # Only these four ever come from the host .env — everything else
      # this app needs is fetched from SSM at container start (see
      # docker-entrypoint.sh / scripts/fetch-secrets.sh).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      AWS_REGION: ${AWS_REGION:?set AWS_REGION in .env}
      APP_ENV: ${APP_ENV:?set APP_ENV in .env (e.g. staging, production) — selects the /united-services/<APP_ENV>/ SSM path}
      # Fixed by this file's own topology (the port this service listens
      # on inside the internal network, and the two paths the volumes
      # below mount into) — not secrets, not environment-specific, so
      # these stay literal rather than round-tripping through SSM.
      PORT: 3002
      KEK_KEYS_DIR: /app/secrets/kek
      GEOIP_MAXMIND_DB_DIR: /app/geoip-db
    volumes:
      # TOTP KEK private keys must survive container restarts/redeploys —
      # never let this be an ephemeral container filesystem path.
      - kek-keys:/app/secrets/kek
      # Downloaded GeoLite2-Country.mmdb — persisted so a restart doesn't
      # force a re-download; docker-entrypoint.sh refreshes it in place
      # on every start (cheap/idempotent — geoipupdate does a conditional
      # fetch) rather than relying on a separate update mechanism.
      - geoip-db:/app/geoip-db
    networks: [internal]

  frontend:
    # Same image:+build: contract as backend above.
    image: ghcr.io/alioskillers/united-services-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    environment:
      # Same four-var contract as backend above — every NEXT_PUBLIC_*
      # build-time value and every other secret comes from SSM at
      # container start, fetched *before* `next build` runs (see
      # docker-entrypoint.sh) since those get inlined into the compiled
      # JS at build time, not read at request time.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      AWS_REGION: ${AWS_REGION:?set AWS_REGION in .env}
      APP_ENV: ${APP_ENV:?set APP_ENV in .env (e.g. staging, production) — selects the /united-services/<APP_ENV>/ SSM path}
      # Fixed by this file's own topology — the port this service listens
      # on, and the backend's address on the internal Docker network
      # (only reachable from other containers in this compose project,
      # never a secret).
      PORT: 3000
      INTERNAL_API_URL: http://backend:3002/api/v1
    networks: [internal]

  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports:
      - "${NGINX_PORT:?set NGINX_PORT in .env (e.g. 80)}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Generated by scripts/update-cloudflare-ips.sh on the host, never
      # committed — see nginx.conf's include of this path.
      - ./nginx/cloudflare-ips.d:/etc/nginx/cloudflare-ips.d:ro
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  redis-data:
  kek-keys:
  libretranslate-models:
  geoip-db:
