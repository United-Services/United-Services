# TEMPLATE — never apply this file directly or commit real values into
# it. Same secrets-never-in-git rule as docker-compose.yml's own header
# comment. Copy this to 21-backend-secret.yaml (already .gitignore'd —
# see k8s/.gitignore), fill in real values, and `kubectl apply -f` that
# instead. Or, for local smoke-testing with no real backend traffic (no
# real users, no real data), use CI-style placeholder values — see this
# repo's own .github/workflows/ci.yml for exactly this pattern
# (CLERK_SECRET_KEY: sk_test_ci-placeholder-key, etc.) applied to the
# backend integration-test job.
#
# BACKEND_POSTGRES_PASSWORD / BACKEND_REDIS_PASSWORD: generate each with
# a CSPRNG (see docker-compose.yml's header comment for the exact
# node -e command) — never reuse between them or with any other
# environment's values.
#
# LOCAL_DATABASE_URL / LOCAL_REDIS_URL: must embed the SAME passwords as
# BACKEND_POSTGRES_PASSWORD/BACKEND_REDIS_PASSWORD above — these are
# what FailoverService actually connects with, the bare
# BACKEND_*_PASSWORD keys only exist so 10-postgres.yaml/11-redis.yaml
# can configure the standby servers themselves with the same value.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: use-backend
type: Opaque
stringData:
  # Only these four ever come from outside SSM — everything else this
  # app needs is fetched from AWS SSM Parameter Store at container start
  # (docker-entrypoint.sh) using them. Same four-var contract as
  # docker-compose.yml's `backend` service.
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  AWS_REGION: "us-east-1"
  APP_ENV: "staging"

  BACKEND_POSTGRES_PASSWORD: "REPLACE_ME"
  BACKEND_REDIS_PASSWORD: "REPLACE_ME"
  LOCAL_DATABASE_URL: "postgresql://united_services:REPLACE_ME@postgres:5432/united_services"
  LOCAL_REDIS_URL: "redis://:REPLACE_ME@redis:6379"

  # Gates GET /metrics (src/metrics/metrics-token.guard.ts) — generate
  # with `python3 -c "import secrets; print(secrets.token_urlsafe(32))"`.
  # Must match whatever Prometheus's own scrape config for this cluster
  # presents (see backend/prometheus/prometheus.yml's `backend` job).
  METRICS_TOKEN: "REPLACE_ME"
