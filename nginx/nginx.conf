worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Real client IP for GeoService/rate-limiting to see, whether this box
  # sits directly on the internet or behind Cloudflare (docs/DEPLOYMENT.md)
  # — Cloudflare's own edge already sets X-Forwarded-For; this proxy_set_header
  # preserves/extends that chain rather than overwriting it.
  map $http_x_forwarded_for $proxy_forwarded_for {
    default "$http_x_forwarded_for, $remote_addr";
    ""      "$remote_addr";
  }

  # Bare-bones abuse protection at the edge, in front of the app's own
  # Redis-backed throttler (app.module.ts) — this is a coarse, IP-based
  # first line of defense, not a replacement for it.
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

  upstream backend {
    server backend:3001;
  }

  upstream frontend {
    server frontend:3000;
  }

  server {
    listen 80;
    server_name _;

    # Site-wide security headers — applied at the edge so they land on
    # every response regardless of which upstream served it (defense in
    # depth on top of the backend's own helmet() config in main.ts, which
    # only covers /api/ responses). `always` so they're sent on error
    # responses too, not just 2xx.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # 'unsafe-inline' on script/style is required here (not on the backend's
    # own CSP, which serves no HTML) because Next.js hydration and Clerk's
    # embedded auth components both rely on inline script/style tags;
    # tightening this further would need a per-request nonce wired through
    # Next's own headers() config. connect-src/frame-src allow Clerk's
    # hosted domains for its auth iframe and API calls.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' https://*.clerk.accounts.dev https://*.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; frame-src https://*.clerk.accounts.dev https://*.clerk.com" always;

    # Never proxy anything that looks like it's trying to reach the
    # backend's internal Prisma/Redis/S3 admin surfaces directly — belt
    # and braces on top of the app's own auth guards.
    location ~ /\. {
      deny all;
    }

    location /api/ {
      limit_req zone=general burst=40 nodelay;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }

    location / {
      limit_req zone=general burst=40 nodelay;

      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      # Next.js dev/HMR and Clerk's client-side redirects both rely on
      # normal keep-alive HTTP, not websockets, in production builds — no
      # Upgrade/Connection headers needed here.
      proxy_read_timeout 60s;
    }
  }
}
