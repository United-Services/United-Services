worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Real client IP for GeoService/rate-limiting to see, whether this box
  # sits directly on the internet or behind Cloudflare (docs/DEPLOYMENT.md)
  # — Cloudflare's own edge already sets X-Forwarded-For; this proxy_set_header
  # preserves/extends that chain rather than overwriting it.
  map $http_x_forwarded_for $proxy_forwarded_for {
    default "$http_x_forwarded_for, $remote_addr";
    ""      "$remote_addr";
  }

  # Bare-bones abuse protection at the edge, in front of the app's own
  # Redis-backed throttler (app.module.ts) — this is a coarse, IP-based
  # first line of defense, not a replacement for it.
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

  upstream backend {
    server backend:3001;
  }

  upstream frontend {
    server frontend:3000;
  }

  server {
    listen 80;
    server_name _;

    # Never proxy anything that looks like it's trying to reach the
    # backend's internal Prisma/Redis/S3 admin surfaces directly — belt
    # and braces on top of the app's own auth guards.
    location ~ /\. {
      deny all;
    }

    location /api/ {
      limit_req zone=general burst=40 nodelay;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }

    location / {
      limit_req zone=general burst=40 nodelay;

      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      # Next.js dev/HMR and Clerk's client-side redirects both rely on
      # normal keep-alive HTTP, not websockets, in production builds — no
      # Upgrade/Connection headers needed here.
      proxy_read_timeout 60s;
    }
  }
}
