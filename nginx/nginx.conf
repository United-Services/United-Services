worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Coarse, IP-based first line of defense in front of the app's own
  # Redis-backed throttler (app.module.ts). $binary_remote_addr is simply
  # whoever actually connected to this server — accurate as-is, since
  # nginx is the first and only thing any request touches right now (no
  # CDN/reverse-proxy layer in front yet).
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

  upstream backend {
    server backend:3002;
  }

  upstream frontend {
    server frontend:3000;
  }

  server {
    # Both ports open and serving the same plain HTTP traffic for now.
    # NOTE: "listen 443" here is NOT TLS/HTTPS — nginx has no certificate
    # yet, so this is just plain HTTP on port 443, not encrypted. Nothing
    # here understands "https://" requests yet. Once there's a real domain
    # and a certificate, this becomes "listen 443 ssl" with the cert
    # config added — that's the point where HTTPS actually starts working,
    # not before.
    listen 80;
    listen 443;
    server_name _;

    # Security headers — independent of domain/HTTPS/Cloudflare, safe to
    # keep regardless of deployment stage. (Strict-Transport-Security is
    # deliberately NOT included yet — it tells browsers "always use HTTPS
    # for this site from now on," which would actively break plain-HTTP
    # access during this transitional period. Add it back only once HTTPS
    # is reliably serving everything.)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # 'unsafe-inline' on script/style is a legacy-browser fallback only:
    # any browser that understands a nonce/hash source ignores
    # 'unsafe-inline' in that same directive once one is present. The one
    # inline script this app renders (frontend/src/app/[locale]/page.tsx's
    # JSON-LD block) is static, so it's allowed via its exact content hash.
    # If that structuredData object is ever edited, this hash must be
    # recomputed (sha256(JSON.stringify(structuredData)), base64-encoded)
    # or the script silently stops rendering in modern browsers. Clerk's
    # own embedded auth components still rely on inline script/style tags
    # we don't control, hence 'unsafe-inline' stays as a fallback.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'sha256-y/ctrHCeGAbwbXadw6FXbwgbja4CsXIrW7f/qcMJ47Q=' 'unsafe-inline' https://*.clerk.accounts.dev https://*.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; frame-src https://*.clerk.accounts.dev https://*.clerk.com" always;

    # Never proxy anything that looks like it's trying to reach the
    # backend's internal Prisma/Redis/S3 admin surfaces directly — belt
    # and braces on top of the app's own auth guards.
    location ~ /\. {
      deny all;
    }

    location /api/ {
      limit_req zone=general burst=40 nodelay;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }

    location / {
      limit_req zone=general burst=40 nodelay;

      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      # Next.js dev/HMR and Clerk's client-side redirects both rely on
      # normal keep-alive HTTP, not websockets, in production builds — no
      # Upgrade/Connection headers needed here.
      proxy_read_timeout 60s;
    }
  }
}