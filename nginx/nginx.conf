worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # docs/DEPLOYMENT.md's documented production architecture is
  # visitor -> Cloudflare (proxied/orange-cloud) -> this nginx -> backend —
  # i.e. TWO hops before the backend, not one. Cloudflare sets
  # CF-Connecting-IP to the real visitor IP on every request it proxies,
  # but that header (like X-Forwarded-For) is just as spoofable as any
  # other by anyone who reaches this box directly, bypassing Cloudflare —
  # unless nginx only trusts it when the connection genuinely originates
  # from one of Cloudflare's own published edge IP ranges. That's what
  # `set_real_ip_from` + `real_ip_header` below does: for connections from
  # a real Cloudflare edge IP, nginx rewrites $remote_addr to the
  # CF-Connecting-IP value *before* anything else in this file runs; for
  # any other connection (e.g. local docker-compose with no Cloudflare in
  # front yet), $remote_addr is untouched and behaves exactly as before.
  # Ranges from https://www.cloudflare.com/ips/ — re-sync periodically,
  # Cloudflare does add/rotate ranges occasionally.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # $remote_addr is now the real visitor IP whenever the request genuinely
  # came via Cloudflare, or the direct connecting IP otherwise — either
  # way it's what we forward as the single X-Forwarded-For hop the
  # backend's `trust proxy: 1` (configure-app.ts) expects to trust.
  map $http_x_forwarded_for $proxy_forwarded_for {
    default "$http_x_forwarded_for, $remote_addr";
    ""      "$remote_addr";
  }

  # Bare-bones abuse protection at the edge, in front of the app's own
  # Redis-backed throttler (app.module.ts) — this is a coarse, IP-based
  # first line of defense, not a replacement for it.
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

  upstream backend {
    server backend:3001;
  }

  upstream frontend {
    server frontend:3000;
  }

  server {
    listen 80;
    server_name _;

    # Site-wide security headers — applied at the edge so they land on
    # every response regardless of which upstream served it (defense in
    # depth on top of the backend's own helmet() config in main.ts, which
    # only covers /api/ responses). `always` so they're sent on error
    # responses too, not just 2xx.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # 'unsafe-inline' on script/style is a legacy-browser fallback only:
    # per the CSP spec, any browser that understands a nonce/hash source
    # ignores 'unsafe-inline' in that same directive once one is present
    # — which is effectively every browser still receiving security
    # updates. The one inline script this app actually renders
    # (frontend/src/app/[locale]/page.tsx's JSON-LD block) is static, so
    # it's allowed via its exact content hash rather than a per-request
    # nonce — a hash is simpler and doesn't need any middleware plumbing
    # for content that never changes at runtime. If that structuredData
    # object is ever edited, this hash must be recomputed
    # (sha256(JSON.stringify(structuredData)), base64-encoded) or the
    # script silently stops rendering in modern browsers. Clerk's own
    # embedded auth components still rely on inline script/style tags we
    # don't control the content of, hence 'unsafe-inline' stays as the
    # fallback rather than being removed outright. connect-src/frame-src
    # allow Clerk's hosted domains for its auth iframe and API calls.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'sha256-y/ctrHCeGAbwbXadw6FXbwgbja4CsXIrW7f/qcMJ47Q=' 'unsafe-inline' https://*.clerk.accounts.dev https://*.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; frame-src https://*.clerk.accounts.dev https://*.clerk.com" always;

    # Never proxy anything that looks like it's trying to reach the
    # backend's internal Prisma/Redis/S3 admin surfaces directly — belt
    # and braces on top of the app's own auth guards.
    location ~ /\. {
      deny all;
    }

    location /api/ {
      limit_req zone=general burst=40 nodelay;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }

    location / {
      limit_req zone=general burst=40 nodelay;

      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      # Next.js dev/HMR and Clerk's client-side redirects both rely on
      # normal keep-alive HTTP, not websockets, in production builds — no
      # Upgrade/Connection headers needed here.
      proxy_read_timeout 60s;
    }
  }
}
