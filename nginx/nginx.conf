worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Compress at the edge — every response this proxy serves (API JSON and
  # the Next.js frontend's HTML/JS/CSS alike) goes through here, so this
  # one place covers both instead of configuring it per-app. Text-ish
  # types only; already-compressed formats (images, fonts) get no benefit
  # and the CPU cost isn't worth it. gzip_min_length skips tiny responses
  # where the compression header overhead outweighs any savings.
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

  # Coarse, IP-based first line of defense in front of the app's own
  # Redis-backed throttler (app.module.ts). $binary_remote_addr is simply
  # whoever actually connected to this server — accurate as-is, since
  # nginx is the first and only thing any request touches right now (no
  # CDN/reverse-proxy layer in front yet).
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

  # /socket.io/ (below) forwards the client's Upgrade header verbatim so
  # a real WebSocket handshake completes — but forwarding it unchecked
  # is exactly the H2C smuggling pattern: a client sending
  # "Upgrade: h2c" instead of "Upgrade: websocket" would get that
  # upgrade attempt proxied straight through too, potentially letting
  # further requests over that connection bypass this proxy's own
  # per-request handling entirely. Only "websocket" (a real WS
  # handshake) or empty (Socket.IO's initial long-polling handshake,
  # which sends no Upgrade header at all — see that location's own
  # comment) are legitimate for this app; anything else is rejected in
  # the location block below rather than forwarded.
  map $http_upgrade $upgrade_is_websocket_or_none {
    "websocket" 1;
    ""          1;
    default     0;
  }

  # Cloudflare real-IP resolution — required the moment Cloudflare fronts
  # this server (docs/DEPLOYMENT.md's Cloudflare setup step,
  # docs/BUSINESS_RULES.md rule 13): without it, backend/src/configure-app.ts's
  # `trust proxy: 1` would trust Cloudflare's edge IP (or a spoofable
  # client-supplied header) as the real visitor, collapsing the per-IP
  # rate limiter into one shared bucket with no error or crash. Harmless
  # before Cloudflare is actually in front: real_ip only substitutes
  # $remote_addr when the actual TCP peer matches one of the ranges below,
  # which won't happen until traffic is genuinely proxied through them.
  # real_ip_recursive stays off — there is exactly one proxy hop
  # (Cloudflare) in front of nginx, not a chain, so resolving past the
  # first CF-Connecting-IP would be wrong, not more correct.
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;
  # Cloudflare's IP ranges themselves are NOT committed here anymore —
  # they used to be a literal, hand-synced block of set_real_ip_from
  # lines in this tracked file, which meant every IP-range rotation
  # either went uncommitted (drifting the deployed config away from git)
  # or got committed as a source change for data that isn't really code.
  # scripts/update-cloudflare-ips.sh now writes them to
  # nginx/cloudflare-ips.d/*.conf instead — gitignored, generated,
  # bind-mounted into this container (see docker-compose.yml) — and this
  # glob include picks them up. A glob (not a fixed filename) so a fresh
  # checkout with no generated file yet still passes `nginx -t` (an
  # `include` of an exact path that doesn't exist fails config
  # validation outright; a glob with zero matches is fine) — real_ip just
  # has nothing to substitute against until the script runs once. Run it
  # immediately after a fresh deploy, not just on the daily
  # cron/systemd timer — see docs/DEPLOYMENT.md.
  include /etc/nginx/cloudflare-ips.d/*.conf;

  # keepalive: without it nginx opens a fresh TCP connection to the
  # upstream on every proxied request, even though the client's connection
  # to nginx itself is kept alive — a real bottleneck once concurrency
  # gets high. keepalive holds a pool of idle upstream connections open
  # for reuse; proxy_http_version 1.1 + clearing the Connection header
  # (below, per location) is required for it to take effect.
  upstream backend {
    server backend:3002;
    keepalive 64;
  }

  upstream frontend {
    server frontend:3000;
    keepalive 64;
  }

  server {
    # Both ports open and serving the same plain HTTP traffic for now.
    # NOTE: "listen 443" here is NOT TLS/HTTPS — nginx has no certificate
    # yet, so this is just plain HTTP on port 443, not encrypted. Nothing
    # here understands "https://" requests yet. Once there's a real domain
    # and a certificate, this becomes "listen 443 ssl" with the cert
    # config added — that's the point where HTTPS actually starts working,
    # not before.
    listen 80;
    listen 443;
    server_name _;

    # Security headers — independent of domain/HTTPS/Cloudflare, safe to
    # keep regardless of deployment stage. (Strict-Transport-Security is
    # deliberately NOT included yet — it tells browsers "always use HTTPS
    # for this site from now on," which would actively break plain-HTTP
    # access during this transitional period. Add it back only once HTTPS
    # is reliably serving everything.)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # $request_id is a per-request random hex string nginx generates on
    # its own (core module, no config needed) — exposed here so a visitor
    # reporting a failed request can hand over an ID that's actually
    # traceable, and forwarded to the backend below (proxy_set_header) so
    # its own access log and AllExceptionsFilter's on-call page — which
    # already reads request.headers['x-request-id'] expecting this to
    # exist — use the exact same value instead of nothing. Public: this
    # is a random opaque token, not anything sensitive.
    add_header X-Request-Id $request_id always;

    # A branded fallback for exactly the case the app itself can never
    # render its own error page for: backend/frontend unreachable (down,
    # still starting, or crash-looping on a failed migration) — nginx is
    # the only thing still running, so this is the one static, dependency-
    # free page that's guaranteed to actually load. Every real app error
    # (a thrown exception, a 404, a failed API call once the app IS up)
    # is still handled by frontend/app/[locale]/error.tsx and friends;
    # this only covers nginx itself failing to reach an upstream at all.
    error_page 502 503 504 /gateway-error.html;
    location = /gateway-error.html {
      root /usr/share/nginx/error-pages;
      internal;
    }
    # Content-Security-Policy is NOT set here anymore. It used to be a
    # static value here (script-src 'unsafe-inline' 'unsafe-eval' ...),
    # which is weak — 'unsafe-inline' allows any inline script to run,
    # attacker-injected or not. The real fix is a nonce that changes on
    # every request, which only the app itself can generate (nginx has no
    # per-request templating for response headers) — frontend/proxy.ts now
    # does this for every page response. Setting a second, different CSP
    # here on top of that would just add a conflicting header (browsers
    # enforce the intersection of multiple CSP headers, so an nginx-level
    # 'unsafe-inline' with no nonce would silently block the very
    # nonce'd scripts the app-level policy allows). The backend's own CSP
    # (helmet defaults, tighter — default-src 'none') already covers its
    # own JSON API responses under /api/ independently of this.

    # Never proxy anything that looks like it's trying to reach the
    # backend's internal Prisma/Redis/S3 admin surfaces directly — belt
    # and braces on top of the app's own auth guards.
    location ~ /\. {
      deny all;
    }

    location /api/ {
      limit_req zone=general burst=40 nodelay;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 60s;
    }

    # Socket.IO (AppointmentsGateway's live open-slots updates) — needs
    # the actual WebSocket Upgrade/Connection headers, which every other
    # location here deliberately clears (they're plain request/response
    # HTTP, no upgrade). Without this block, socket.io's handshake falls
    # through to the generic proxy_set_header Connection "" above and
    # the upgrade never completes — it silently falls back to HTTP
    # long-polling instead of a real WebSocket, which still works but
    # defeats the point. proxy_read_timeout is long (not 60s) because
    # this is a long-lived connection, not a request/response cycle —
    # a normal timeout would kill idle sockets and force constant
    # reconnects.
    location /socket.io/ {
      # H2C smuggling guard — see the map's own comment above. A plain
      # `if` inside a location is normally worth avoiding in nginx, but
      # this is exactly the narrow, well-defined case it's fine for:
      # one condition, a `return`, nothing else in the block depends on
      # it.
      if ($upgrade_is_websocket_or_none = 0) {
        return 400;
      }
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    # Next's own build output under /_next/static/ is content-hashed —
    # every filename changes when its contents do, so it's safe to tell
    # the browser to cache it forever and never even ask nginx again.
    # Previously these fell through to the same `location /` block as
    # every HTML page, which forwards no caching headers at all — the
    # browser was re-fetching unchanging JS/CSS chunks on every private
    # dashboard section switch (each one is a client-side route change
    # that re-requests its chunk) as if they were dynamic content.
    location /_next/static/ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Next.js already sets its own (weaker) Cache-Control on these —
      # without hiding it first, add_header appends a second header
      # rather than overriding it, and browsers' handling of duplicate
      # Cache-Control headers is undefined/inconsistent.
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Static assets under /images/ (logos, marketing photography) are NOT
    # content-hashed — a deploy can change a file at the same path — so
    # this uses a shorter cache plus revalidation instead of `immutable`.
    # Still a large win: these were previously served with no
    # Cache-Control at all, so every dashboard/page load re-fetched the
    # logo and every other static image from scratch.
    location /images/ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location / {
      limit_req zone=general burst=40 nodelay;

      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
      # Next.js dev/HMR and Clerk's client-side redirects both rely on
      # normal keep-alive HTTP, not websockets, in production builds — no
      # Upgrade/Connection headers needed here.
      proxy_read_timeout 60s;
    }
  }
}
