worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Don't advertise the exact nginx build in the Server header / error
  # pages. Cloudflare rewrites Server: to "cloudflare" for proxied
  # traffic, so this only matters for anyone who reaches the origin
  # directly — which is exactly the person it should not be helping.
  server_tokens off;

  # Every file upload in this app is a presigned direct-to-S3 PUT
  # (backend/src/uploads/uploads.controller.ts — CVs and ID documents
  # included), so no upload body ever transits nginx. This limit
  # therefore only has to cover ordinary JSON API bodies; 2m is
  # deliberate headroom over those rather than nginx's silent 1m
  # default, and keeps a request-body flood from being free.
  client_max_body_size 2m;

  # Compress at the edge — every response this proxy serves (API JSON and
  # the Next.js frontend's HTML/JS/CSS alike) goes through here, so this
  # one place covers both instead of configuring it per-app. Text-ish
  # types only; already-compressed formats (images, fonts) get no benefit
  # and the CPU cost isn't worth it. gzip_min_length skips tiny responses
  # where the compression header overhead outweighs any savings.
  # (No brotli: stock nginx has no brotli module, and Cloudflare
  # re-compresses with brotli at the edge for every browser that asks —
  # adding a third-party module to this image would buy nothing.)
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

  # Coarse, IP-based first line of defense in front of the app's own
  # Redis-backed throttler (app.module.ts). $binary_remote_addr is the
  # real visitor once Cloudflare is in front, because real_ip (below)
  # rewrites $remote_addr from CF-Connecting-IP before these zones are
  # evaluated — so this stays per-visitor rather than collapsing every
  # request into one bucket keyed on a Cloudflare edge IP.
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  # Concurrent-connection cap alongside the request-rate cap: a slowloris
  # or a socket.io reconnect storm opens many simultaneous connections
  # without ever exceeding 20r/s, which limit_req alone does not see.
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  # Both default to 503, which this config maps to the branded
  # "we're having trouble" gateway page via error_page — telling a
  # rate-limited client the site is broken, and (worse) telling a
  # scraper nothing that would make it back off. 429 is the accurate
  # status and is what clients retry-with-backoff on.
  limit_req_status 429;
  limit_conn_status 429;

  # HSTS value, keyed on whether this request actually arrived over TLS.
  # nginx omits an add_header whose value is the empty string, so the
  # same snippets/security-headers.conf include is correct in both the
  # plain-HTTP server and the TLS server: a deployment with no
  # certificate yet never starts advertising HTTPS-only to browsers,
  # which would be unrecoverable for the length of the max-age.
  #
  # max-age is one year, includeSubDomains is on (api.use-eg.com and
  # clerk.use-eg.com are both HTTPS-only from day one, so nothing is
  # stranded). `preload` is deliberately NOT here: submitting to
  # hstspreload.org bakes use-eg.com and EVERY current and future
  # subdomain into browser binaries, removal takes months, and this is a
  # first deploy where a subdomain that has to speak plain HTTP for some
  # reason is still entirely plausible. Add `; preload` and submit only
  # after the site has been up on HTTPS for a few uneventful weeks.
  map $scheme $hsts {
    https "max-age=31536000; includeSubDomains";
    default "";
  }

  # /socket.io/ forwards the client's Upgrade header verbatim so a real
  # WebSocket handshake completes — but forwarding it unchecked is
  # exactly the H2C smuggling pattern: a client sending "Upgrade: h2c"
  # instead of "Upgrade: websocket" would get that upgrade attempt
  # proxied straight through too, potentially letting further requests
  # over that connection bypass this proxy's own per-request handling
  # entirely. Only "websocket" (a real WS handshake) or empty
  # (Socket.IO's initial long-polling handshake, which sends no Upgrade
  # header at all) are legitimate for this app; anything else is
  # rejected in the location block rather than forwarded.
  map $http_upgrade $upgrade_is_websocket_or_none {
    "websocket" 1;
    ""          1;
    default     0;
  }

  # Cloudflare real-IP resolution — required the moment Cloudflare fronts
  # this server (docs/DEPLOYMENT.md's Cloudflare setup step,
  # docs/BUSINESS_RULES.md rule 13): without it, backend/src/configure-app.ts's
  # `trust proxy: 1` would trust Cloudflare's edge IP (or a spoofable
  # client-supplied header) as the real visitor, collapsing the per-IP
  # rate limiter into one shared bucket with no error or crash. Harmless
  # before Cloudflare is actually in front: real_ip only substitutes
  # $remote_addr when the actual TCP peer matches one of the ranges below,
  # which won't happen until traffic is genuinely proxied through them.
  # real_ip_recursive stays off — there is exactly one proxy hop
  # (Cloudflare) in front of nginx, not a chain, so resolving past the
  # first CF-Connecting-IP would be wrong, not more correct.
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;
  # Cloudflare's IP ranges themselves are NOT committed here —
  # scripts/update-cloudflare-ips.sh writes them to
  # nginx/cloudflare-ips.d/*.conf (gitignored, generated, bind-mounted
  # into this container) and this glob include picks them up. A glob (not
  # a fixed filename) so a fresh checkout with no generated file yet
  # still passes `nginx -t`. Run it immediately after a fresh deploy, not
  # just on the daily cron/systemd timer — see docs/DEPLOYMENT.md.
  include /etc/nginx/cloudflare-ips.d/*.conf;

  # keepalive: without it nginx opens a fresh TCP connection to the
  # upstream on every proxied request, even though the client's connection
  # to nginx itself is kept alive — a real bottleneck once concurrency
  # gets high. keepalive holds a pool of idle upstream connections open
  # for reuse; proxy_http_version 1.1 + clearing the Connection header
  # (per location) is required for it to take effect.
  upstream backend {
    server backend:3002;
    keepalive 64;
  }

  upstream frontend {
    server frontend:3000;
    keepalive 64;
  }

  # Plain HTTP, catch-all. This stays exactly as capable as it is today:
  # it is what serves the deployment before DNS/certificates exist, what
  # answers direct-IP access and container/uptime healthchecks
  # (GET /api/v1/health), and what a `docker compose up` on a laptop
  # talks to. It is NOT a redirect-only stub — installing HTTPS must not
  # be able to strand a deployment that isn't ready for it. The
  # http→https redirect for use-eg.com specifically lives in
  # tls.d/use-eg.com.conf, which only exists once a certificate does.
  #
  # NOTE: the old `listen 443;` here is gone. It was plain HTTP on port
  # 443 (no certificate), and leaving it in place alongside a real
  # `listen 443 ssl` server would make the ssl-ness of the :443 socket
  # depend on server-block ordering.
  server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/app-routes.conf;
  }

  # HTTPS lives here, one file per certificate-bearing hostname. Glob, so
  # zero files (no certificate yet — today, and every fresh checkout)
  # is a valid, working config rather than a boot failure. Must come
  # after the default server above so that block keeps default_server
  # status for :80.
  include /etc/nginx/tls.d/*.conf;
}
