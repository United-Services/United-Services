worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Compress at the edge — every response this proxy serves (API JSON and
  # the Next.js frontend's HTML/JS/CSS alike) goes through here, so this
  # one place covers both instead of configuring it per-app. Text-ish
  # types only; already-compressed formats (images, fonts) get no benefit
  # and the CPU cost isn't worth it. gzip_min_length skips tiny responses
  # where the compression header overhead outweighs any savings.
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

  # Coarse, IP-based first line of defense in front of the app's own
  # Redis-backed throttler (app.module.ts). $binary_remote_addr is simply
  # whoever actually connected to this server — accurate as-is, since
  # nginx is the first and only thing any request touches right now (no
  # CDN/reverse-proxy layer in front yet).
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

  # Cloudflare real-IP resolution — required the moment Cloudflare fronts
  # this server (docs/DEPLOYMENT.md's Cloudflare setup step,
  # docs/BUSINESS_RULES.md rule 13): without it, backend/src/configure-app.ts's
  # `trust proxy: 1` would trust Cloudflare's edge IP (or a spoofable
  # client-supplied header) as the real visitor, collapsing the per-IP
  # rate limiter into one shared bucket with no error or crash. Harmless
  # before Cloudflare is actually in front: real_ip only substitutes
  # $remote_addr when the actual TCP peer matches one of the ranges below,
  # which won't happen until traffic is genuinely proxied through them.
  # real_ip_recursive stays off — there is exactly one proxy hop
  # (Cloudflare) in front of nginx, not a chain, so resolving past the
  # first CF-Connecting-IP would be wrong, not more correct.
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;
  # BEGIN cloudflare-ips — managed by scripts/update-cloudflare-ips.sh, do not edit by hand
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  # END cloudflare-ips

  # keepalive: without it nginx opens a fresh TCP connection to the
  # upstream on every proxied request, even though the client's connection
  # to nginx itself is kept alive — a real bottleneck once concurrency
  # gets high. keepalive holds a pool of idle upstream connections open
  # for reuse; proxy_http_version 1.1 + clearing the Connection header
  # (below, per location) is required for it to take effect.
  upstream backend {
    server backend:3002;
    keepalive 64;
  }

  upstream frontend {
    server frontend:3000;
    keepalive 64;
  }

  server {
    # Both ports open and serving the same plain HTTP traffic for now.
    # NOTE: "listen 443" here is NOT TLS/HTTPS — nginx has no certificate
    # yet, so this is just plain HTTP on port 443, not encrypted. Nothing
    # here understands "https://" requests yet. Once there's a real domain
    # and a certificate, this becomes "listen 443 ssl" with the cert
    # config added — that's the point where HTTPS actually starts working,
    # not before.
    listen 80;
    listen 443;
    server_name _;

    # Security headers — independent of domain/HTTPS/Cloudflare, safe to
    # keep regardless of deployment stage. (Strict-Transport-Security is
    # deliberately NOT included yet — it tells browsers "always use HTTPS
    # for this site from now on," which would actively break plain-HTTP
    # access during this transitional period. Add it back only once HTTPS
    # is reliably serving everything.)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # $request_id is a per-request random hex string nginx generates on
    # its own (core module, no config needed) — exposed here so a visitor
    # reporting a failed request can hand over an ID that's actually
    # traceable, and forwarded to the backend below (proxy_set_header) so
    # its own access log and AllExceptionsFilter's on-call page — which
    # already reads request.headers['x-request-id'] expecting this to
    # exist — use the exact same value instead of nothing. Public: this
    # is a random opaque token, not anything sensitive.
    add_header X-Request-Id $request_id always;
    # NOTE: this previously carried a sha256 hash alongside 'unsafe-inline'
    # in script-src, on the theory that 'unsafe-inline' would act as a
    # fallback for anything the hash didn't cover. That's not how CSP
    # works: per spec, 'unsafe-inline' is ignored entirely once ANY
    # hash/nonce source is present in the same directive — confirmed live
    # in a browser, where the hash-based version silently blocked Next's
    # own required inline hydration scripts on every page, not just
    # allowed the one JSON-LD block it was meant for. Dropped the hash;
    # script-src now falls back to plain 'unsafe-inline', which is weaker
    # (no longer restricts inline scripts to known-good content) but is
    # what was actually in effect anyway once Clerk's own inline
    # script/style tags are accounted for. A real fix would be nonce-based
    # CSP (a fresh nonce per request, threaded to every inline script) —
    # bigger effort, not done here. style-src/font-src also need
    # fonts.googleapis.com/fonts.gstatic.com for the Poppins font
    # (frontend/app/globals.css's @import) — confirmed blocked without them.
    # 'unsafe-eval' is required too, not optional: clerk-js evaluates code
    # dynamically as part of its WASM-backed WebAuthn/passkey crypto.
    # Without it the <SignIn>/<SignUp> widget fails to mount at all (blank
    # panel, CSP violation the only clue) — this was live-broken on every
    # auth page between the CSP being added and this fix.
    # worker-src is needed too: clerk-js spawns a Web Worker from a blob:
    # URL, which falls back to script-src when worker-src is unset — but a
    # blob: worker isn't covered by the host-based clerk.accounts.dev
    # allowlist there, so it stayed blocked even after 'unsafe-eval' fixed
    # the base widget rendering. Confirmed live.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.clerk.accounts.dev https://*.clerk.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.clerk.accounts.dev https://*.clerk.com https://*.s3.us-east-1.amazonaws.com; frame-src https://*.clerk.accounts.dev https://*.clerk.com" always;

    # Never proxy anything that looks like it's trying to reach the
    # backend's internal Prisma/Redis/S3 admin surfaces directly — belt
    # and braces on top of the app's own auth guards.
    location ~ /\. {
      deny all;
    }

    location /api/ {
      limit_req zone=general burst=40 nodelay;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 60s;
    }

    # Next's own build output under /_next/static/ is content-hashed —
    # every filename changes when its contents do, so it's safe to tell
    # the browser to cache it forever and never even ask nginx again.
    # Previously these fell through to the same `location /` block as
    # every HTML page, which forwards no caching headers at all — the
    # browser was re-fetching unchanging JS/CSS chunks on every private
    # dashboard section switch (each one is a client-side route change
    # that re-requests its chunk) as if they were dynamic content.
    location /_next/static/ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Next.js already sets its own (weaker) Cache-Control on these —
      # without hiding it first, add_header appends a second header
      # rather than overriding it, and browsers' handling of duplicate
      # Cache-Control headers is undefined/inconsistent.
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Static assets under /images/ (logos, marketing photography) are NOT
    # content-hashed — a deploy can change a file at the same path — so
    # this uses a shorter cache plus revalidation instead of `immutable`.
    # Still a large win: these were previously served with no
    # Cache-Control at all, so every dashboard/page load re-fetched the
    # logo and every other static image from scratch.
    location /images/ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location / {
      limit_req zone=general burst=40 nodelay;

      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
      # Next.js dev/HMR and Clerk's client-side redirects both rely on
      # normal keep-alive HTTP, not websockets, in production builds — no
      # Upgrade/Connection headers needed here.
      proxy_read_timeout 60s;
    }
  }
}
