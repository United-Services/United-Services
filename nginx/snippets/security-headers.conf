# Shared security headers — included at server level AND repeated inside
# every location that sets an add_header/proxy_hide_header of its own.
# nginx's header inheritance is all-or-nothing per context: a location
# containing even one add_header stops inheriting ALL server-level ones,
# so /_next/static/ and /images/ (which set their own Cache-Control)
# would otherwise serve with no X-Frame-Options, no nosniff and no HSTS.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Request-Id $request_id always;

# HSTS, emitted only when this server block actually terminated TLS.
# $hsts (mapped in nginx.conf) is the empty string on the plain-HTTP
# server, and nginx skips an add_header whose value is empty — so one
# identical include is correct in both the :80 and the :443 block, and
# the cert-less local/pre-DNS deployment never starts advertising HSTS
# by accident.
#
# Next.js sets its own Strict-Transport-Security (frontend/next.config.mjs
# headers()); hide the upstream copy so exactly one authoritative value
# reaches the browser rather than two that can diverge.
proxy_hide_header Strict-Transport-Security;
add_header Strict-Transport-Security $hsts always;
