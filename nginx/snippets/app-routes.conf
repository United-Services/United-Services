# Every route this proxy serves, shared verbatim by the plain-HTTP
# server in nginx.conf and the TLS server in tls.d/use-eg.com.conf.
# Kept in one file rather than copy-pasted into both so the two can
# never drift — a route that works on :80 and 404s/misbehaves on :443
# is exactly the class of bug that only shows up in production.

include /etc/nginx/snippets/security-headers.conf;

# A branded fallback for the one case the app can never render its own
# error page for: backend/frontend unreachable (down, still starting, or
# crash-looping on a failed migration).
error_page 502 503 504 /gateway-error.html;
location = /gateway-error.html {
  root /usr/share/nginx/error-pages;
  internal;
}

location ~ /\. {
  deny all;
}

location /api/ {
  limit_req  zone=general burst=40 nodelay;
  limit_conn perip 40;

  proxy_pass http://backend;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Request-Id $request_id;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
}

location /socket.io/ {
  # H2C smuggling guard — see the map's comment in nginx.conf.
  if ($upgrade_is_websocket_or_none = 0) {
    return 400;
  }
  limit_conn perip 40;

  proxy_pass http://backend;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Long-lived connection, not a request/response cycle.
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  # Socket.IO's HTTP long-polling fallback and any server-sent frames
  # must reach the client as they are produced, not after nginx has
  # filled a buffer.
  proxy_buffering off;
}

# Content-hashed build output — safe to cache forever.
location /_next/static/ {
  proxy_pass http://frontend;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Next.js sets its own weaker Cache-Control; without hiding it first
  # add_header appends a second header rather than overriding.
  proxy_hide_header Cache-Control;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  include /etc/nginx/snippets/security-headers.conf;
}

# Not content-hashed — shorter cache plus revalidation.
location /images/ {
  proxy_pass http://frontend;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "public, max-age=3600, must-revalidate" always;
  include /etc/nginx/snippets/security-headers.conf;
}

location / {
  limit_req  zone=general burst=40 nodelay;
  limit_conn perip 40;

  proxy_pass http://frontend;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Request-Id $request_id;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
}
